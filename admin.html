<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  // Keep using your existing publishable (anon) key — never service_role in frontend
  const SUPABASE_URL = 'https://lrexqjkjfpzzswwfogyq.supabase.co';

  const SUPABASE_ANON_KEY = 'sb_publishable_OZuwiFc_JRrmCIQpUS7xnA_hiYMdQJx';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function loadOrders() {
    const ordersTable = document.getElementById('ordersTable');
    if (!ordersTable) {
      console.error('ordersTable element not found in DOM');
      return;
    }

    if (!supabase) {
      ordersTable.innerHTML = `<tr><td colspan="99">Supabase client not initialized</td></tr>`;
      return;
    }

    const { data, error } = await supabase
      .from('orders')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      // Show the EXACT Supabase error, not a generic message
      ordersTable.innerHTML = `<tr><td colspan="99">Error loading orders: ${error.message} (code: ${error.code || 'n/a'})</td></tr>`;
      console.error('Supabase error loading orders:', error);
      return;
    }

    if (!data || data.length === 0) {
      ordersTable.innerHTML = `<tr><td colspan="99">No orders found</td></tr>`;
      return;
    }

    // ... your existing render logic using `data`
  }

  // Ensure it runs only after the DOM (and ordersTable) exists
  document.addEventListener('DOMContentLoaded', loadOrders);
</script>
